name: BackroomsGen
version: '1.0.0'
main: com.derpcraft.backrooms.BackroomsPlugin
api-version: '1.21'
load: STARTUP
softdepend:
  - BlueMap
  - MultiWorld
  - WorldEdit
  - WorldGuard

commands:
  backrooms:
    description: Teleport to the Backrooms world
    usage: /<command>
    permission: backrooms.use
  backroomsadmin:
    description: Admin commands for BackroomsGen
    usage: /<command> <create|reload|setlevel>
    permission: backrooms.admin

permissions:
  backrooms.use:
    description: Allows teleporting to the Backrooms
    default: true
  backrooms.admin:
    description: Admin access to BackroomsGen commands
    default: op
